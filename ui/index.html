<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adhikar · Data Rights Ledger</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
/* =========================================================
   ADHIKAR — DESIGN TOKENS
   Subject: DPDP (India) data-rights request review, an
   analyst-facing compliance ledger. Palette is built around
   trust + authority + literal redaction, not decoration.

   --ink        #0A0D12  page ground, near-black indigo-ink
   --paper      #12161D  card ground (ledger card, not "panel")
   --paper-2    #171C25  raised card ground
   --line       #242C38  hairline rule
   --seal       #D6A84B  official-seal gold — approval, brand, focus of trust
   --danger     #E5555F  reserved strictly for blocked / adversarial
   --amber      #E8A33D  SLA at-risk only
   --verified   #35C793  chain-intact / success only
   ========================================================= */
:root{
  color-scheme: dark;
  --ink:#0A0D12;
  --paper:#12161D;
  --paper-2:#171C25;
  --paper-3:#1C222C;
  --line:#242C38;
  --line-soft:#1A2029;
  --text:#ECEFF3;
  --muted:#8993A3;
  --muted-2:#5F6B7C;
  --seal:#D6A84B;
  --seal-soft:#3A2E15;
  --seal-ink:#1B1206;
  --danger:#E5555F;
  --danger-dim:#2B1519;
  --amber:#E8A33D;
  --amber-dim:#2C2313;
  --verified:#35C793;
  --verified-dim:#0F251E;
  --radius-lg:18px;
  --radius:13px;
  --radius-sm:8px;
  --font-display:ui-serif, Georgia, serif;
  --font-body:ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono:ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 88% -8%, rgba(214,168,75,.07), transparent 60%),
    radial-gradient(ellipse 700px 500px at -5% 15%, rgba(84,113,255,.05), transparent 55%),
    var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:var(--seal);color:var(--seal-ink);}
button,textarea,select,input{font:inherit;color:inherit;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px;border-radius:4px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2a323e;border-radius:99px;}

/* faint ledger-rule texture, very low opacity, purely atmospheric */
.ledger-texture{
  position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image: repeating-linear-gradient(180deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 1px, transparent 34px);
}

.shell{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}

/* ---------- header ---------- */
header{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 28px; border-bottom:1px solid var(--line);
  background:rgba(10,13,18,.86); backdrop-filter:blur(16px);
  position:sticky; top:0; z-index:20;
}
.brand{display:flex; align-items:center; gap:13px;}
.brand-mark{
  width:40px; height:40px; display:grid; place-items:center; flex:none;
  border:1px solid #4a3a1c; border-radius:10px; color:var(--seal);
  background:linear-gradient(150deg, #241a0c, #14100a);
  font-family:var(--font-display); font-weight:650; font-size:20px;
  box-shadow: inset 0 0 0 1px rgba(214,168,75,.08);
}
.brand h1{margin:0; font-family:var(--font-display); font-weight:560; font-size:17px; letter-spacing:.01em;}
.brand p{margin:1px 0 0; color:var(--muted); font-size:11.5px; font-family:var(--font-mono);}
.stats-ribbon{display:flex; align-items:stretch; gap:0; border:1px solid var(--line); border-radius:11px; overflow:hidden; background:var(--paper);}
.stat{padding:7px 16px; text-align:center; border-right:1px solid var(--line); min-width:74px;}
.stat:last-child{border-right:0;}
.stat b{display:block; font-family:var(--font-mono); font-size:16px; font-weight:600; line-height:1.1;}
.stat span{display:block; color:var(--muted); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; margin-top:3px;}
.stat.risk b{color:var(--amber);}
.stat.blocked b{color:var(--danger);}
.stat.chain b{color:var(--verified); font-size:13px;}
.stat.chain.broken b{color:var(--danger);}
@media (max-width:900px){ .stats-ribbon{display:none;} }

/* ---------- layout ---------- */
main{flex:1; display:grid; grid-template-columns:minmax(340px, 34%) 1fr; min-height:0;}
.pane-left{border-right:1px solid var(--line); padding:24px; overflow:auto;}
.pane-right{padding:24px; overflow:auto;}
@media (max-width:900px){
  main{grid-template-columns:1fr;}
  .pane-left{border-right:0; border-bottom:1px solid var(--line);}
}

.eyebrow{color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; margin:0 0 10px;}

.card{
  background:linear-gradient(165deg, var(--paper-2), var(--paper));
  border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px;
  box-shadow:0 18px 44px rgba(0,0,0,.22);
}
.stack{display:grid; gap:16px;}

/* ---------- compose form ---------- */
.field label{display:block; color:#c3ccd4; font-size:12px; font-weight:600; margin-bottom:6px;}
.hint{color:var(--muted-2); font-size:11px; margin-top:5px; line-height:1.4;}
select, textarea{
  width:100%; color:var(--text); background:var(--ink);
  border:1px solid #2b3340; border-radius:var(--radius-sm); padding:10px 11px;
  outline:none; transition:border-color .15s, box-shadow .15s;
}
select{appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position:calc(100% - 16px) center, calc(100% - 11px) center; background-size:5px 5px; background-repeat:no-repeat;}
textarea{min-height:190px; resize:vertical; font-family:var(--font-mono); font-size:12.5px; line-height:1.6;}
select:focus, textarea:focus{border-color:var(--seal); box-shadow:0 0 0 3px rgba(214,168,75,.13);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

.mode-list{display:grid; gap:8px;}
.mode-card{
  display:flex; gap:11px; align-items:flex-start; cursor:pointer;
  border:1px solid var(--line); border-radius:var(--radius); padding:11px 12px;
  background:var(--paper-3); transition:border-color .15s, background .15s;
}
.mode-card:hover{border-color:#3a4756;}
.mode-card:has(input:checked){border-color:var(--seal); background:var(--seal-soft);}
.mode-card input{accent-color:var(--seal); margin-top:3px; flex:none;}
.mode-card b{display:block; font-size:12.5px; font-weight:650;}
.mode-card .desc{display:block; color:var(--muted); font-size:11px; margin-top:2px; line-height:1.45;}
.mode-tag{font-family:var(--font-mono); font-size:9.5px; color:var(--seal); letter-spacing:.04em;}

.toggle-row{display:flex; flex-direction:column; gap:9px;}
.toggle{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.toggle .t-label{display:flex; flex-direction:column;}
.toggle .t-label b{font-size:12px; font-weight:600;}
.toggle .t-label span{font-size:10.5px; color:var(--muted);}
.switch{position:relative; width:38px; height:22px; flex:none;}
.switch input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1;}
.switch .track{position:absolute; inset:0; background:#293140; border-radius:99px; transition:background .15s;}
.switch .thumb{position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#7b8695; transition:transform .18s cubic-bezier(.6,0,.3,1), background .15s;}
.switch input:checked ~ .track{background:#3a5b41;}
.switch input:checked ~ .thumb{transform:translateX(16px); background:var(--verified);}

.btn-primary{
  border:0; border-radius:var(--radius-sm); padding:12px 18px; cursor:pointer;
  color:var(--seal-ink); font-weight:700; font-size:13px; background:var(--seal);
  box-shadow:0 10px 26px rgba(214,168,75,.16); transition:filter .15s, transform .1s;
  width:100%;
}
.btn-primary:hover:not(:disabled){filter:brightness(1.07);}
.btn-primary:active:not(:disabled){transform:translateY(1px);}
.btn-primary:disabled{opacity:.55; cursor:progress;}
.btn-secondary{
  border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 14px;
  color:var(--text); background:var(--paper-3); cursor:pointer; font-weight:600; font-size:12.5px;
  transition:border-color .15s, background .15s;
}
.btn-secondary:hover{border-color:#3a4756; background:#20262f;}
.btn-danger-text{border:1px solid var(--danger-dim); color:#ffb3ba; background:rgba(229,85,95,.08);}
.btn-danger-text:hover{border-color:#5c2a2f;}

/* ---------- queue ---------- */
.queue-wrap{margin-top:22px;}
.queue-list{display:grid; gap:7px;}
.queue-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;
  border:1px solid var(--line); border-left:3px solid var(--line); background:var(--paper-3);
  border-radius:var(--radius-sm); padding:9px 11px; transition:border-color .15s, background .15s;
}
.queue-row:hover{background:#1a212b;}
.queue-row.active{border-color:var(--seal); border-left-color:var(--seal);}
.queue-row.st-blocked{border-left-color:var(--danger);}
.queue-row.st-review{border-left-color:var(--amber);}
.queue-row.st-cleared{border-left-color:var(--verified);}
.queue-row.st-rejected{border-left-color:var(--muted-2);}
.queue-id{font-family:var(--font-mono); font-size:11px; color:#c9d2d7; display:block;}
.queue-right{color:var(--muted); font-size:10.5px; display:block; margin-top:2px;}
.queue-status{font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:3px 7px; border-radius:99px; white-space:nowrap;}
.queue-empty{color:var(--muted); font-size:12px; padding:14px; text-align:center; border:1px dashed var(--line); border-radius:var(--radius-sm);}

/* ---------- empty state (hero / thesis) ---------- */
.empty-hero{min-height:calc(100vh - 220px); display:grid; place-items:center; text-align:center; padding:20px;}
.empty-inner{max-width:480px;}
.seal-illustration{width:104px; height:104px; margin:0 auto 26px;}
.empty-hero h2{
  font-family:var(--font-display); font-weight:520; font-size:29px; letter-spacing:-.01em;
  margin:0 0 12px; line-height:1.22;
}
.empty-hero h2 em{font-style:italic; color:var(--seal);}
.empty-hero p{color:var(--muted); font-size:13.5px; line-height:1.6; margin:0 0 22px;}
.empty-steps{display:flex; flex-direction:column; gap:0; text-align:left; border-top:1px solid var(--line);}
.empty-step{display:flex; gap:12px; padding:12px 2px; border-bottom:1px solid var(--line);}
.empty-step .mark{font-family:var(--font-mono); color:var(--seal); font-size:11px; flex:none; padding-top:2px;}
.empty-step b{display:block; font-size:12.5px;}
.empty-step span{display:block; color:var(--muted); font-size:11.5px; margin-top:1px;}

/* ---------- result header ---------- */
.result-top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.status-pill{
  border-radius:99px; padding:6px 12px; font-size:10.5px; font-weight:800;
  letter-spacing:.08em; text-transform:uppercase; color:var(--verified); background:var(--verified-dim);
  border:1px solid #235141; display:inline-flex; align-items:center; gap:6px;
}
.status-pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
.status-pill.review{color:var(--amber); background:var(--amber-dim); border-color:#5c4620;}
.status-pill.blocked{color:#ff9ca5; background:var(--danger-dim); border-color:#6c2b32;}
.status-pill.rejected{color:var(--muted); background:var(--paper-3); border-color:var(--line);}
.req-meta{color:var(--muted); font-family:var(--font-mono); font-size:11px; text-align:right;}

.alert-box{
  border:1px solid #6c2b32; background:linear-gradient(90deg, rgba(229,85,95,.14), rgba(229,85,95,.05));
  border-radius:var(--radius); padding:13px 15px; color:#ffc4ca; margin-bottom:16px;
  display:flex; gap:11px; align-items:flex-start;
  animation: slideIn .35s cubic-bezier(.2,.9,.25,1) both;
}
.alert-box .icon{font-size:16px; flex:none; line-height:1.3;}
.alert-box strong{display:block; color:#fff; font-size:12.5px; margin-bottom:2px;}
.alert-box span{font-size:11.5px; opacity:.9; line-height:1.5;}

/* ---------- redaction diff — signature element ---------- */
.redact-card .eyebrow{display:flex; align-items:center; justify-content:space-between;}
.protect-count{color:var(--seal); font-family:var(--font-mono); font-size:10.5px;}
.diff{display:grid; grid-template-columns:1fr 1fr; gap:1px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--line);}
.diff-pane{background:var(--ink); min-width:0;}
.diff-title{padding:8px 12px; color:var(--muted); background:var(--paper-3); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700;}
.diff-body{margin:0; padding:13px; min-height:120px; max-height:220px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font-family:var(--font-mono); font-size:11.5px; line-height:1.65; color:#cdd6dc;}
@media (max-width:900px){ .diff{grid-template-columns:1fr;} }

.pii{position:relative; padding:0 2px; border-radius:3px; color:var(--text); transition:color .16s ease .04s;}
.pii::before{content:""; position:absolute; inset:-1px -1px; background:#05070a; border-radius:3px; transform:scaleX(0); transform-origin:left; transition:transform .38s cubic-bezier(.65,0,.35,1);}
.pii.redacted{color:transparent;}
.pii.redacted::before{transform:scaleX(1);}
.pii-tag{position:absolute; top:-17px; left:0; font-family:var(--font-mono); font-size:8px; letter-spacing:.05em; color:var(--seal); opacity:0; text-transform:uppercase; white-space:nowrap; transition:opacity .2s ease .3s;}
.pii.redacted .pii-tag{opacity:.85;}
.token-out{color:#7fd9b6; font-weight:600;}

/* ---------- classification + SLA ---------- */
.metrics-grid{display:grid; grid-template-columns:1.25fr .95fr; gap:16px;}
@media (max-width:700px){ .metrics-grid{grid-template-columns:1fr;} }
.right-name{font-family:var(--font-display); font-size:25px; font-weight:560; letter-spacing:-.01em; line-height:1.15;}
.right-sub{color:var(--muted); font-size:11px; margin-top:6px; line-height:1.5;}
.right-sub b{color:#c3ccd4; font-weight:600;}
.confidence-row{display:flex; align-items:center; gap:10px; margin-top:14px;}
.conf-bar{flex:1; height:5px; background:#232b36; border-radius:99px; overflow:hidden;}
.conf-bar > i{display:block; height:100%; background:linear-gradient(90deg, var(--seal), #f0cd82); border-radius:inherit; transition:width .6s cubic-bezier(.2,.9,.25,1);}
.conf-label{font-family:var(--font-mono); font-size:11px; color:var(--muted); white-space:nowrap;}
.reason-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
.chip{font-size:10.5px; padding:4px 9px; border-radius:99px; border:1px solid; line-height:1.4;}
.chip.warn{color:var(--amber); border-color:#4a3a1a; background:var(--amber-dim);}
.chip.danger{color:#ff9ca5; border-color:#5c2a2f; background:var(--danger-dim);}
.chip.neutral{color:var(--muted); border-color:var(--line); background:var(--paper-3);}

.sla-card{display:flex; flex-direction:column;}
.sla-gauge-wrap{display:flex; align-items:center; gap:14px; margin-top:4px;}
.sla-value{font-family:var(--font-mono); font-size:20px; font-weight:600;}
.sla-sub{color:var(--muted); font-size:10.5px; margin-top:3px; line-height:1.5;}
.sla-legal-note{margin-top:12px; padding-top:11px; border-top:1px solid var(--line); color:var(--muted-2); font-size:10px; line-height:1.5;}

/* ---------- draft card + seal ---------- */
.draft-card{position:relative; overflow:hidden;}
.draft-body{
  white-space:pre-wrap; min-height:76px; padding:13px; border-radius:var(--radius-sm);
  color:#ced7dc; background:var(--ink); border:1px solid var(--line-soft); font-size:12.5px; line-height:1.6;
}
.draft-body.withheld{color:var(--muted); display:grid; place-items:center; font-style:italic; text-align:center; font-size:12px;}
.draft-actions{display:flex; gap:9px; margin-top:12px;}
.draft-approved-note{display:flex; align-items:center; gap:8px; color:var(--verified); font-size:11.5px; font-weight:600; margin-top:12px;}
.draft-rejected-note{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11.5px; margin-top:12px;}

.seal-overlay{
  position:absolute; top:14px; right:16px; width:82px; height:82px; pointer-events:none;
  opacity:0; transform:scale(2.4) rotate(-18deg); z-index:5;
}
.seal-overlay.show{animation: stampDown .55s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes stampDown{
  0%{opacity:0; transform:scale(2.6) rotate(-20deg);}
  55%{opacity:1; transform:scale(.92) rotate(-7deg);}
  75%{transform:scale(1.05) rotate(-9deg);}
  100%{opacity:1; transform:scale(1) rotate(-8deg);}
}

/* ---------- trace ---------- */
details.trace-details{border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--paper);}
summary{padding:14px 16px; cursor:pointer; color:#c8d2d7; font-weight:650; font-size:12.5px; list-style:none; display:flex; align-items:center; justify-content:space-between;}
summary::-webkit-details-marker{display:none;}
summary::after{content:"＋"; color:var(--muted); font-size:13px;}
details[open] summary::after{content:"－";}
.trace-meta{display:flex; flex-wrap:wrap; gap:7px; padding:0 16px 12px;}
.trace-badge{border:1px solid var(--line); border-radius:99px; padding:4px 9px; font-size:10px; color:#bcc7cd; background:var(--paper-3); font-family:var(--font-mono);}
pre.trace-json{border-top:1px solid var(--line); margin:0; padding:16px; max-height:340px; overflow:auto; color:#8fd3bf; background:#080b0d; white-space:pre-wrap; overflow-wrap:anywhere; font-family:var(--font-mono); font-size:10.8px; line-height:1.6;}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line); padding:10px 28px; display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--muted-2); font-size:10.5px; flex-wrap:wrap;}
.chain-badge{display:inline-flex; align-items:center; gap:6px; color:var(--verified);}
.chain-badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
.chain-badge.broken{color:var(--danger);}

/* ---------- modal (reject reason) ---------- */
.modal-veil{position:fixed; inset:0; background:rgba(6,8,11,.66); backdrop-filter:blur(3px); display:grid; place-items:center; z-index:50; animation:fadeIn .18s ease both;}
.modal-box{width:min(420px, 90vw); background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px; box-shadow:0 30px 70px rgba(0,0,0,.45); animation:popIn .22s cubic-bezier(.2,.9,.25,1) both;}
.modal-box h3{margin:0 0 6px; font-family:var(--font-display); font-weight:560; font-size:17px;}
.modal-box p{margin:0 0 14px; color:var(--muted); font-size:12px; line-height:1.5;}
.modal-box textarea{min-height:88px; font-family:var(--font-body); font-size:13px;}
.modal-actions{display:flex; justify-content:flex-end; gap:9px; margin-top:14px;}

/* ---------- toast ---------- */
.toast{position:fixed; right:20px; bottom:20px; padding:12px 15px; max-width:360px; border:1px solid #3a4a44; background:#131b18; border-radius:var(--radius-sm); color:#d9eee8; transform:translateY(14px); opacity:0; pointer-events:none; transition:.22s cubic-bezier(.2,.9,.25,1); z-index:60; font-size:12.5px; box-shadow:0 14px 30px rgba(0,0,0,.35);}
.toast.show{transform:none; opacity:1;}
.toast.error{border-color:#5c2a2f; background:#1a0e0f; color:#ffb3ba;}

/* ---------- keyframes ---------- */
@keyframes slideIn{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:none;}}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes popIn{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;}}
@keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.rise{animation:riseIn .42s cubic-bezier(.2,.9,.25,1) both;}
@keyframes floatSeal{0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);}}
@keyframes drawArc{from{stroke-dashoffset:251.2;}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}
</style>
</head>

<div class="ledger-texture"></div>
<div id="root"></div>

/* =====================================================================
   PII SPAN DETECTION — used for the animated before/after diff only.
   This runs client-side so the user can see exactly what gets masked
   before the request is sent to the backend.
   ===================================================================== */
function findSpans(text) {
  const spans = [];
  const patterns = [
    { type: "email",   re: /[\w.+-]+@[\w-]+\.[\w.-]+/g },
    { type: "phone",   re: /(?:\+91[-\s]?)?[6-9]\d{9}\b/g },
    { type: "aadhaar", re: /\b\d{4}\s?\d{4}\s?\d{4}\b/g },
    { type: "pan",     re: /\b[A-Z]{5}\d{4}[A-Z]\b/g },
    { type: "name",    re: /\b(?:I am|I,|My name is|myself)\s+([A-Z][a-z]+(?:\s[A-Z][a-z]+){0,2})/g },
  ];
  patterns.forEach(({ type, re }) => {
    let m;
    while ((m = re.exec(text))) {
      if (type === "name") {
        const start = m.index + m[0].indexOf(m[1]);
        spans.push({ type, start, end: start + m[1].length });
      } else {
        spans.push({ type, start: m.index, end: m.index + m[0].length });
      }
    }
  });
  spans.sort((a, b) => a.start - b.start);
  const clean = [];
  let lastEnd = -1;
  spans.forEach(s => { if (s.start >= lastEnd) { clean.push(s); lastEnd = s.end; } });
  return clean;
}

function maskedText(text, spans) {
  let out = "", cursor = 0;
  spans.forEach(s => {
    out += text.slice(cursor, s.start);
    out += `[REDACTED:${s.type.toUpperCase()}]`;
    cursor = s.end;
  });
  out += text.slice(cursor);
  return out;
}

/* =====================================================================
   RECORD ADAPTER — maps DPRRecord (FastAPI) → what UI components expect.
   rawText and spans are stored client-side; they are never in the API response.
   ===================================================================== */
function buildReasonChips(reasons) {
  return (reasons || []).map(r => REASON_CHIP_MAP[r] || { text: r, level: "neutral" });
}

function adaptRecord(api, rawText, tokenizationMode, redactPii) {
  const spans = findSpans(rawText);
  const protectedText = redactPii ? maskedText(rawText, spans) : rawText;
  const rightKey = (api.verdict?.right_claimed || "UNCLEAR").toUpperCase();
  const rightLabel = RIGHT_LABELS[rightKey] || RIGHT_LABELS.UNCLEAR;
  const reasonChips = buildReasonChips(api.verdict?.escalation?.reasons);
  if (rightKey === "GRIEVANCE" && !reasonChips.length) {
    reasonChips.push({ text: "Grievances are routed to a human reviewer by policy.", level: "warn" });
  }
  const hm = api.harness_meta || {};
  const harnessRedactions = hm.redactions || [];
  const harnessCount = harnessRedactions.reduce((n, r) => n + (r.count || 1), 0);
  return {
    id: api.id,
    status: api.status,
    createdAt: api.received_at,
    slaDueAt: api.sla_due_at,
    org_id: api.org_id,
    region: hm.region_served || "in",
    policy_version: api.policy_version,
    verdict: {
      right_claimed: rightLabel.name,
      right_key: rightKey.toLowerCase(),
      confidence: api.verdict?.confidence ?? 0.5,
      secondary_rights: (api.verdict?.secondary_rights || []).map(r => RIGHT_LABELS[r]?.name || r),
      escalation: api.verdict?.escalation || { required: false, reasons: [] },
      draft_response: api.verdict?.draft_response || null,
    },
    harness_meta: {
      injection_flagged: hm.injection_flagged ?? false,
      local_protected: redactPii ? spans.length : 0,
      harness_redactions: harnessCount,
      sla_rule: { days: rightLabel.days, basis: "Organisation SLA policy — configured, not a statutory deadline" },
      ...hm,
    },
    spans,
    rawText,
    protectedText,
    reasonChips,
    trace: {
      region_served: hm.region_served || "in",
      provider: hm.provider || "konsole",
      model: hm.model || "n/a",
      latency_ms: hm.latency_ms || 0,
      prompt_tokens: hm.prompt_tokens || 0,
      completion_tokens: hm.completion_tokens || 0,
      cost_usd: hm.cost_usd || 0,
      protected_input: protectedText,
      tokenization_mode: tokenizationMode,
      harness_redactions: harnessRedactions,
    },
  };
}

function AnimatedNumber({ value }) {
  const [display, setDisplay] = useState(0);
  useEffect(() => {
    let raf; const start = performance.now(); const from = display;
    const dur = 420;
    const step = (t) => {
      const p = Math.min(1, (t - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      setDisplay(Math.round(from + (value - from) * eased));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line
  }, [value]);
  return <b>{display}</b>;
}

function SlaGauge({ fraction, color }) {
  const r = 34, c = 2 * Math.PI * r;
  const [offset, setOffset] = useState(c);
  useEffect(() => {
    const t = setTimeout(() => setOffset(c - c * fraction), 80);
    return () => clearTimeout(t);
  }, [fraction, c]);
  return (
    <svg width="84" height="84" viewBox="0 0 84 84" style={{ flex: "none" }}>
      <circle cx="42" cy="42" r={r} fill="none" stroke="#232b36" strokeWidth="7" />
      <circle cx="42" cy="42" r={r} fill="none" stroke={color} strokeWidth="7" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={offset} transform="rotate(-90 42 42)"
        style={{ transition: "stroke-dashoffset 1s cubic-bezier(.2,.9,.25,1)" }} />
    </svg>
  );
}

function RedactedSpan({ span, text, i, revealed }) {
  return (
    <span className={"pii" + (revealed ? " redacted" : "")} style={{ transitionDelay: `${i * 55}ms` }}>
      <span className="pii-tag">{span.type}</span>
      {text.slice(span.start, span.end)}
    </span>
  );
}

function RedactionDiff({ record }) {
  const [revealed, setRevealed] = useState(false);
  useEffect(() => {
    setRevealed(false);
    const t = setTimeout(() => setRevealed(true), 120);
    return () => clearTimeout(t);
  }, [record.id]);

  const parts = useMemo(() => {
    const { rawText, spans } = record;
    const out = []; let cursor = 0;
    spans.forEach((s, i) => {
      if (s.start > cursor) out.push(<React.Fragment key={"t" + i}>{rawText.slice(cursor, s.start)}</React.Fragment>);
      out.push(<RedactedSpan key={"s" + i} span={s} text={rawText} i={i} revealed={revealed} />);
      cursor = s.end;
    });
    if (cursor < rawText.length) out.push(<React.Fragment key="tend">{rawText.slice(cursor)}</React.Fragment>);
    return out;
  }, [record, revealed]);

  const localCount = record.harness_meta.local_protected || 0;
  const harnessCount = record.harness_meta.harness_redactions || 0;
  const total = localCount + harnessCount || record.spans.length;

  return (
    <div className="card redact-card rise">
      <div className="eyebrow">
        <span>Identifier protection</span>
        <span className="protect-count">{total} masked · {localCount} device · {harnessCount} service</span>
      </div>
      <div className="diff">
        <div className="diff-pane">
          <div className="diff-title">Submitted · as typed</div>
          <pre className="diff-body">{record.spans.length ? parts : record.rawText}</pre>
        </div>
        <div className="diff-pane">
          <div className="diff-title">Sent to service · masked</div>
          <pre className="diff-body">{record.protectedText.split(/(\[REDACTED:[A-Z]+\])/g).map((chunk, i) =>
            chunk.startsWith("[REDACTED") ? <span key={i} className="token-out">{chunk}</span> : chunk
          )}</pre>
        </div>
      </div>
    </div>
  );
}

function SlaCard({ record }) {
  if (!record.slaDueAt) {
    return (
      <div className="card sla-card rise">
        <div className="eyebrow">Response due</div>
        <div className="sla-sub" style={{ marginTop: 12 }}>SLA not assigned — request blocked or pending policy lookup.</div>
        <div className="sla-legal-note">SLA window is a configured org policy — not legal advice on statutory deadlines.</div>
      </div>
    );
  }
  const due = new Date(record.slaDueAt);
  const total = record.harness_meta.sla_rule.days;
  const now = new Date();
  const daysLeft = Math.max(0, Math.ceil((due - now) / 86400000));
  const fraction = Math.max(0, Math.min(1, daysLeft / total));
  const risk = daysLeft <= Math.ceil(total * 0.25);
  const color = risk ? "var(--amber)" : "var(--verified)";
  return (
    <div className="card sla-card rise">
      <div className="eyebrow">Response due</div>
      <div className="sla-gauge-wrap">
        <SlaGauge fraction={fraction} color={risk ? "#E8A33D" : "#35C793"} />
        <div>
          <div className="sla-value" style={{ color }}>{daysLeft} {daysLeft === 1 ? "day" : "days"} left</div>
          <div className="sla-sub">Due {due.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })}</div>
        </div>
      </div>
      <div className="sla-legal-note">SLA window is a configured org policy, shown for planning — not legal advice on statutory deadlines.</div>
    </div>
  );
}

function DraftCard({ record, onApprove, onReject, approved }) {
  const escalated = record.verdict.escalation.required;
  const withheld = escalated || !record.verdict.draft_response;
  const isApproved = record.status === "APPROVED" || approved;
  const isRejected = record.status === "REJECTED";
  return (
    <div className="card draft-card rise">
      <div className="eyebrow">Draft response · needs a person's approval</div>
      <div className={"draft-body" + (withheld ? " withheld" : "")}>
        {withheld ? "Draft withheld — this request needs a specialist's review before any response is prepared." : record.verdict.draft_response}
      </div>
      {isApproved ? (
        <div className="draft-approved-note">✓ Approved and queued for the next controlled step. Nothing external has been sent.</div>
      ) : isRejected ? (
        <div className="draft-rejected-note">✗ Rejected — reason logged to the audit trail.</div>
      ) : (
        <div className="draft-actions">
          <button className="btn-primary" style={{ width: "auto", flex: 1 }} onClick={onApprove} disabled={withheld}>Approve draft</button>
          <button className="btn-secondary btn-danger-text" onClick={onReject}>Reject</button>
        </div>
      )}
      <SealOverlay show={isApproved} />
    </div>
  );
}

  const t = record.trace;
  const badges = [
    "region " + t.region_served,
    t.provider,
    t.model,
    t.latency_ms + " ms",
    t.prompt_tokens ? t.prompt_tokens + " prompt tok" : null,
    t.completion_tokens ? t.completion_tokens + " completion tok" : null,
    t.harness_redactions?.length ? t.harness_redactions.map(r => r.count + "×" + r.kind).join(" ") + " svc-redacted" : null,
  ].filter(Boolean);
  return (
    <details className="trace-details">
      <summary>Decision trace · protected payload and harness metadata</summary>
      <div className="trace-meta">
        {badges.map((v, i) => <span key={i} className="trace-badge">{v}</span>)}
      </div>
      <pre className="trace-json">{JSON.stringify(t, null, 2)}</pre>
    </details>
  );
}

        <textarea autoFocus value={reason} onChange={e => setReason(e.target.value)} placeholder="e.g. Identity proof doesn't match the correction requested." />
        <div className="modal-actions">
          <button className="btn-secondary" onClick={onCancel}>Cancel</button>
          <button className="btn-secondary btn-danger-text" disabled={!reason.trim()} onClick={() => onConfirm(reason.trim())}>Reject request</button>
        </div>
      </div>
    </div>
  );
}

function ResultView({ record, approved, onApprove, onRejectConfirm }) {
  const [showModal, setShowModal] = useState(false);
  // Show the adversarial banner on any adversarial signal, not just the harness
  // flag: Konsole never sets injection_flagged, so the finding arrives as an
  // ADVERSARIAL_CONTENT reason. Keying off the reason keeps the banner consistent
  // with the BLOCKED status the pipeline assigns on every backend.
  const flagged = record.harness_meta.injection_flagged
    || (record.verdict?.escalation?.reasons || []).includes("ADVERSARIAL_CONTENT");
  const statusClass = { BLOCKED: "blocked", NEEDS_HUMAN_REVIEW: "review", REJECTED: "rejected" }[record.status] || "";
  return (
    <div>
      <div className="result-top">
        <span className={"status-pill " + statusClass}>{record.status.replaceAll("_", " ")}</span>
        <span className="req-meta">{record.id} · {new Date(record.createdAt).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</span>
      </div>
      {flagged && (
        <div className="alert-box">
          <span className="icon">⚑</span>
          <span><strong>Adversarial content detected in this request.</strong><span>The embedded instructions were ignored, not followed, and logged as a security finding in the audit chain.</span></span>
        </div>
      )}
      <div className="result-grid" style={{ display: "grid", gap: 16 }}>
        <RedactionDiff record={record} />
        <div className="metrics-grid">
          <ClassificationCard record={record} />
          <SlaCard record={record} />
        </div>
        <DraftCard record={record} approved={approved}
          onApprove={onApprove}
          onReject={() => setShowModal(true)} />
        <TraceDetails record={record} />
      </div>
      {showModal && <RejectModal recordId={record.id} onCancel={() => setShowModal(false)} onConfirm={(reason) => { setShowModal(false); onRejectConfirm(reason); }} />}
    </div>
  );
}

/* =====================================================================
   APP SHELL — all API calls go here; components stay pure.
   ===================================================================== */
function App() {
  const [text, setText] = useState("");
  const [org, setOrg] = useState("demo-org");
  const [region, setRegion] = useState("in");
  const [mode, setMode] = useState("defence_in_depth");
  const [injectionCheck, setInjectionCheck] = useState(true);
  const [redaction, setRedaction] = useState(true);
  const [loading, setLoading] = useState(false);
  const [records, setRecords] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [approvedIds, setApprovedIds] = useState({});
  const [toastMsg, setToastMsg] = useState("");
  const [toastError, setToastError] = useState(false);
  const [chainStatus, setChainStatus] = useState({ intact: null, events: 0 });
  const toastTimer = useRef(null);

  const active = records.find(r => r.id === activeId) || null;

  const showToast = useCallback((msg, isError = false) => {
    setToastMsg(msg);
    setToastError(isError);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(""), isError ? 4000 : 2800);
  }, []);

  const refreshChain = useCallback(async () => {
    try {
      const resp = await fetch("/api/audit/verify");
      if (resp.ok) {
        const data = await resp.json();
        setChainStatus({ intact: data.intact !== false, events: data.events ?? 0 });
      }
    } catch (_) { /* backend offline, keep previous state */ }
  }, []);

  useEffect(() => { refreshChain(); }, [refreshChain]);

  const handleSubmit = async () => {
    if (!text.trim()) { showToast("Paste or select a request first."); return; }
    setLoading(true);
    try {
      const resp = await fetch("/api/requests", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text,
          org_id: org,
          policy_overrides: {
            region,
            tokenization_mode: mode,
            redact_pii: redaction,
            injection_check: injectionCheck,
          },
        }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        const msg = err?.detail?.message || err?.detail?.code || `API error ${resp.status}`;
        showToast(msg, true);
        return;
      }
      const apiRecord = await resp.json();
      const record = adaptRecord(apiRecord, text, mode, redaction);
      setRecords(prev => [record, ...prev.filter(r => r.id !== record.id)]);
      setActiveId(record.id);
      refreshChain();
    } catch (e) {
      showToast("Backend offline — run: source .venv/bin/activate && make demo", true);
    } finally {
      setLoading(false);
    }
  };

  const handleApprove = async () => {
    if (!active) return;
    try {
      const resp = await fetch(`/api/requests/${active.id}/approve`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ analyst_id: "analyst-demo", reason: "" }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        showToast(err?.detail?.message || "Cannot approve this request.", true);
        return;
      }
      const updated = await resp.json();
      setRecords(prev => prev.map(r => r.id === updated.id ? { ...r, status: updated.status } : r));
      setApprovedIds(prev => ({ ...prev, [active.id]: true }));
      showToast("Approved and queued for the next controlled step. Nothing external has been sent.");
      refreshChain();
    } catch (e) {
      showToast("Backend offline.", true);
    }
  };

  const handleReject = async (reason) => {
    if (!active) return;
    try {
      const resp = await fetch(`/api/requests/${active.id}/reject`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ analyst_id: "analyst-demo", reason }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        showToast(err?.detail?.message || "Could not reject.", true);
        return;
      }
      const updated = await resp.json();
      setRecords(prev => prev.map(r => r.id === updated.id ? { ...r, status: updated.status } : r));
      showToast("Rejected — reason logged to the audit trail.");
      refreshChain();
    } catch (e) {
      showToast("Backend offline.", true);
    }
  };

  const stats = useMemo(() => ({
    open:    records.filter(r => !["APPROVED", "REJECTED"].includes(r.status)).length,
    review:  records.filter(r => r.status === "NEEDS_HUMAN_REVIEW").length,
    blocked: records.filter(r => r.status === "BLOCKED").length,
  }), [records]);

  const chainOk = chainStatus.intact !== false;

  return (
    <div className="shell">
      <header>
        <div className="brand">
          <div className="brand-mark">अ</div>
          <div><h1>ADHIKAR</h1><p>DATA PRINCIPAL REQUEST LEDGER</p></div>
        </div>
        <div className="stats-ribbon">
          <div className="stat"><AnimatedNumber value={stats.open} /><span>Open</span></div>
          <div className="stat risk"><AnimatedNumber value={stats.review} /><span>Review</span></div>
          <div className="stat blocked"><AnimatedNumber value={stats.blocked} /><span>Blocked</span></div>
          <div className={"stat chain" + (chainOk ? "" : " broken")}>
            <b>{chainOk ? "✓" : "✗"}</b>
            <span>Chain {chainOk ? "intact" : "broken"}</span>
          </div>
        </div>
      </header>
      <main>
        <section className="pane-left">
          <div className="eyebrow">New request</div>
          <ComposePanel
            text={text} setText={setText} org={org} setOrg={setOrg}
            region={region} setRegion={setRegion} mode={mode} setMode={setMode}
            injectionCheck={injectionCheck} setInjectionCheck={setInjectionCheck}
            redaction={redaction} setRedaction={setRedaction}
            onSubmit={handleSubmit} loading={loading}
          />
          <QueueList records={records} activeId={activeId} onSelect={r => setActiveId(r.id)} />
        </section>
        <section className="pane-right">
          {active ? (
            <ResultView record={active} approved={!!approvedIds[active.id]}
              onApprove={handleApprove} onRejectConfirm={handleReject} />
          ) : <EmptyState />}
        </section>
      </main>
      <footer>
        <span>Controls aligned to DPDP obligations · identity verification remains out of band · no request is auto-approved.</span>
        <span className={"chain-badge" + (chainOk ? "" : " broken")}>
          {chainOk ? "chain intact" : "chain broken"} · {chainStatus.events} event{chainStatus.events === 1 ? "" : "s"}
        </span>
      </footer>
      <div className={"toast" + (toastMsg ? " show" : "") + (toastError ? " error" : "")}>{toastMsg}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script src="/assets/app.min.js?v=0ab60ca296cd"></script>
</body>
